version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Keep Gradle/Maven dependencies current.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

    ignore:
      # Gson 2.15 raises the Android minimum to API 24.
      - dependency-name: "com.google.code.gson:gson"
        versions: ["[2.15,)"]
    groups:
      android-toolchain:
        patterns: ["com.android.application", "com.android.library", "gradle-wrapper"]

  # Keep the pinned build image current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    ignore:
      # Stay on JDK 25 LTS; reconsider the next LTS when it is available.
      - dependency-name: "eclipse-temurin"
        versions: [">= 26"]
