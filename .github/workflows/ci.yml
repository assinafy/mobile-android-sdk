name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_RUNTIME_VERSION: '25'
  JAVA_TOOLCHAIN_VERSION: '17'
  ANDROID_PLATFORM: '37.0'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  verify:
    name: Build, test, lint, and publish locally
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JDK ${{ env.JAVA_TOOLCHAIN_VERSION }} toolchain
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}
          distribution: temurin

      - name: Use JDK ${{ env.JAVA_RUNTIME_VERSION }} runtime
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ env.JAVA_RUNTIME_VERSION }}
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify SDK and publication
        run: >-
          ./gradlew
          :sdk:assembleRelease
          :sdk:test
          :sdk:lintDebug
          :sdk:ktlintCheck
          :sdk:dokkaGeneratePublicationHtml
          :sdk:publishReleasePublicationToMavenLocal
          :consumer-smoke:assembleRelease
          -Pversion=0.0.0-ci-SNAPSHOT
          --no-daemon
          --stacktrace

      - name: Test release automation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-results
          path: |
            consumer-smoke/build/outputs/apk/release/
            sdk/build/outputs/aar/
            sdk/build/publications/release/
            sdk/build/reports/tests/
            sdk/build/test-results/
            sdk/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: verify
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/create_release.py

