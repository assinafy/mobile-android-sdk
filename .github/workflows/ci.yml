name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_RUNTIME_VERSION: '25'
  JAVA_TOOLCHAIN_VERSION: '17'
  ANDROID_PLATFORM: '37.0'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  verify:
    name: Build, test, lint, and publish locally
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JDK ${{ env.JAVA_TOOLCHAIN_VERSION }} toolchain
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_TOOLCHAIN_VERSION }}
          distribution: temurin

      - name: Use JDK ${{ env.JAVA_RUNTIME_VERSION }} runtime
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_RUNTIME_VERSION }}
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify SDK and publication
        run: >-
          ./gradlew
          :sdk:assembleRelease
          :sdk:test
          :sdk:lintDebug
          :sdk:ktlintCheck
          :sdk:dokkaGeneratePublicationHtml
          :sdk:publishReleasePublicationToMavenLocal
          :consumer-smoke:assembleRelease
          -Pversion=0.0.0-ci-SNAPSHOT
          --no-daemon
          --stacktrace

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-results
          path: |
            consumer-smoke/build/outputs/apk/release/
            sdk/build/outputs/aar/
            sdk/build/publications/release/
            sdk/build/reports/tests/
            sdk/build/test-results/
            sdk/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 14

