image: eclipse-temurin:25.0.4_7-jdk-noble@sha256:534968c051301957beae735e7ba1db54d99ddecf08746d3b9d4f318cc132dbc3

stages:
  - verify
  - integration
  - release
  - release-verification

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_COMMAND_LINE_TOOLS_VERSION: "16111833"
  ANDROID_COMMAND_LINE_TOOLS_SHA256: "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-ci-home"
  GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

default:
  interruptible: true
  cache:
    key: gradle-9.5-agp-9.3.2-android-37.0
    paths:
      - .gradle-ci-home/caches/
      - .gradle-ci-home/wrapper/
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends ca-certificates curl jq openjdk-17-jdk-headless unzip
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/android" ]; then
        curl --fail --location --silent --show-error \
          "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMAND_LINE_TOOLS_VERSION}_latest.zip" \
          --output /tmp/android-command-line-tools.zip
        echo "${ANDROID_COMMAND_LINE_TOOLS_SHA256}  /tmp/android-command-line-tools.zip" | sha256sum --check --strict
        unzip -q /tmp/android-command-line-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        rm /tmp/android-command-line-tools.zip
      fi
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/android" sdk install "build-tools/36.0.0" "platform-tools" "platforms/android-37.0"'
    - 'test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"'

verify:
  stage: verify
  timeout: 30 minutes
  script:
    - >-
      ./gradlew
      :sdk:assembleRelease
      :sdk:test
      :sdk:lintDebug
      :sdk:ktlintCheck
      :sdk:dokkaGeneratePublicationHtml
      :sdk:publishReleasePublicationToMavenLocal
      :consumer-smoke:assembleRelease
      -Pversion=0.0.0-ci-SNAPSHOT
      --no-daemon
      --stacktrace
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - consumer-smoke/build/outputs/apk/release/
      - sdk/build/outputs/aar/
      - sdk/build/publications/release/
      - sdk/build/reports/tests/
      - sdk/build/test-results/
      - sdk/build/reports/lint-results-debug.html
      - sdk/build/reports/lint-results-debug.xml
      - sdk/build/reports/lint-results-debug.txt
    reports:
      junit: sdk/build/test-results/*/TEST-*.xml

live-sandbox:
  stage: integration
  timeout: 20 minutes
  interruptible: false
  resource_group: assinafy-sandbox
  environment:
    name: sandbox
  variables:
    ASSINAFY_API_KEY: "$ASSINAFY_SANDBOX_API_KEY"
    ASSINAFY_ACCOUNT_ID: "$ASSINAFY_SANDBOX_ACCOUNT_ID"
    ASSINAFY_BASE_URL: "https://sandbox.assinafy.com.br/v1"
    ASSINAFY_TEST_EMAIL: "$ASSINAFY_SANDBOX_TEST_EMAIL"
    ASSINAFY_TEST_EMAIL_2: "$ASSINAFY_SANDBOX_TEST_EMAIL_2"
    ASSINAFY_SIGNER_ACCESS_CODE: "$ASSINAFY_SANDBOX_SIGNER_ACCESS_CODE"
    ASSINAFY_REQUIRE_LIVE: "true"
    ASSINAFY_LIVE_WRITES: "true"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  script:
    - >-
      ./gradlew
      :sdk:testDebugUnitTest
      --tests 'com.assinafy.sdk.live.*'
      --rerun-tasks
      --no-daemon
      --stacktrace
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - sdk/build/reports/tests/testDebugUnitTest/
      - sdk/build/test-results/testDebugUnitTest/
    reports:
      junit: sdk/build/test-results/testDebugUnitTest/TEST-*.xml

publish-release:
  stage: release
  timeout: 45 minutes
  interruptible: false
  resource_group: assinafy-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - release_version="${CI_COMMIT_TAG#v}"
    - |
      set -eu
      published_pom="https://repo.maven.apache.org/maven2/com/assinafy/assinafy-android-sdk/${release_version}/assinafy-android-sdk-${release_version}.pom"
      if curl --fail --silent --output /dev/null "$published_pom"; then
        echo "Maven Central already contains ${CI_COMMIT_TAG}; skipping the immutable upload"
        exit 0
      fi

      : "${CENTRAL_USERNAME:?Set the protected CENTRAL_USERNAME CI variable}"
      : "${CENTRAL_PASSWORD:?Set the protected CENTRAL_PASSWORD CI variable}"
      : "${MAVEN_SIGNING_PASSWORD:?Set the protected MAVEN_SIGNING_PASSWORD CI variable}"
      if [ -z "${MAVEN_SIGNING_KEY:-}" ] && [ -z "${MAVEN_SIGNING_KEY_FILE:-}" ]; then
        echo "Set MAVEN_SIGNING_KEY or the MAVEN_SIGNING_KEY_FILE CI file variable" >&2
        exit 1
      fi

      ./gradlew \
        :sdk:testDebugUnitTest \
        :sdk:centralBundle \
        -Pversion="$release_version" \
        --no-daemon \
        --stacktrace

      central_bearer="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
      deployment_id="$(
        curl --fail --silent --show-error \
          --header "Authorization: Bearer ${central_bearer}" \
          --form "bundle=@sdk/build/distributions/central-bundle.zip;type=application/octet-stream" \
          "https://central.sonatype.com/api/v1/publisher/upload?name=assinafy-android-${release_version}&publishingType=AUTOMATIC"
      )"
      deployment_id="$(printf '%s' "$deployment_id" | tr -d '\r\n')"
      test -n "$deployment_id"

      for attempt in $(seq 1 80); do
        deployment_status="$(
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${central_bearer}" \
            "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}"
        )"
        deployment_state="$(printf '%s' "$deployment_status" | jq -r '.deploymentState')"
        case "$deployment_state" in
          PUBLISHED)
            break
            ;;
          FAILED)
            printf '%s\n' "$deployment_status" | jq . >&2
            exit 1
            ;;
          PENDING|VALIDATING|VALIDATED|PUBLISHING)
            ;;
          *)
            echo "Unexpected Maven Central deployment state: ${deployment_state}" >&2
            printf '%s\n' "$deployment_status" | jq . >&2
            exit 1
            ;;
        esac
        if [ "$attempt" -eq 80 ]; then
          echo "Maven Central deployment did not finish; deployment ID: ${deployment_id}" >&2
          exit 1
        fi
        sleep 15
      done

verify-release:
  stage: release-verification
  timeout: 20 minutes
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - release_version="${CI_COMMIT_TAG#v}"
    - |
      set -eu
      published_pom="https://repo.maven.apache.org/maven2/com/assinafy/assinafy-android-sdk/${release_version}/assinafy-android-sdk-${release_version}.pom"
      for attempt in $(seq 1 20); do
        if curl --fail --silent --output /dev/null "$published_pom"; then
          break
        fi
        if [ "$attempt" -eq 20 ]; then
          echo "Published artifact did not reach Maven Central: ${published_pom}" >&2
          exit 1
        fi
        sleep 15
      done

      ASSINAFY_REMOTE_PACKAGE_VERIFY=true \
        ./gradlew \
          :consumer-smoke:assembleRelease \
          -Pversion="$release_version" \
          --refresh-dependencies \
          --no-daemon \
          --stacktrace
